<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="CRM+OKR公司管理系统高保真交互原型">
  <link rel="icon" href="data:,">
  <title>中泰旭鼎 · CRM+OKR经营管理系统</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="org.css">
  <link rel="stylesheet" href="performance.css">
  <link rel="stylesheet" href="performance-fixes.css">
  <link rel="stylesheet" href="project-detail.css">
  <link rel="stylesheet" href="project-board.css">
  <link rel="stylesheet" href="delivery-templates.css">
  <link rel="stylesheet" href="asset-management.css">
  <link rel="stylesheet" href="lead-allocation.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="主导航">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <div><strong>中泰旭鼎</strong><small>经营管理系统</small></div>
      </div>
      <nav class="side-nav">
        <p class="nav-group">经营</p>
        <button class="nav-item active" data-view="overview"><span class="nav-icon">⌂</span><span>经营总览</span></button>
        <button class="nav-item" data-view="sales"><span class="nav-icon">◎</span><span>销售中心</span><b class="nav-count">12</b></button>
        <button class="nav-item" data-view="projects"><span class="nav-icon">▣</span><span>项目交付</span></button>
        <button class="nav-item" data-view="tickets"><span class="nav-icon">↗</span><span>协作工单</span><b class="nav-count warn">5</b></button>
        <button class="nav-item" data-view="schedule"><span class="nav-icon">□</span><span>排期会议</span></button>
        <p class="nav-group">组织</p>
        <button class="nav-item" data-view="performance"><span class="nav-icon">◇</span><span>目标绩效</span></button>
        <button class="nav-item" data-view="people"><span class="nav-icon">♙</span><span>员工管理</span></button>
        <button class="nav-item" data-view="assets"><span class="nav-icon">▦</span><span>固定资产</span><b class="nav-count warn">3</b></button>
        <button class="nav-item" data-view="knowledge"><span class="nav-icon">◫</span><span>AI知识库</span></button>
      </nav>
      <div class="sidebar-foot">
        <button class="rail-action" id="syncButton"><span>↻</span><span><b>飞书同步正常</b><small>最近同步 09:42</small></span></button>
        <div class="account-wrap">
          <button class="user-card" id="accountButton" aria-label="打开账户菜单" aria-expanded="false" aria-controls="accountMenu">
            <span class="avatar">王</span><span class="user-copy"><b>王晨</b><small>经营管理层</small></span><span class="account-more" aria-hidden="true">•••</span>
          </button>
          <div class="account-menu" id="accountMenu" hidden>
            <div class="account-menu-head"><b>王晨</b><small>经营管理层 · 全公司数据权限</small></div>
            <button data-account-action="profile"><span>个人资料</span><small>账号信息与飞书绑定</small></button>
            <button data-account-action="notifications"><span>我的通知</span><small>查看待处理业务事项</small></button>
            <button data-account-action="permissions"><span>权限与数据范围</span><small>查看当前角色授权</small></button>
            <button class="account-logout" data-account-action="logout"><span>退出登录</span></button>
          </div>
        </div>
      </div>
    </aside>
    <div class="mobile-scrim" id="mobileScrim"></div>

    <section class="workspace">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="menuButton" aria-label="打开导航">☰</button>
        <div class="breadcrumb" id="breadcrumb"><span>经营中心</span><b>/</b><strong>经营总览</strong></div>
        <div class="top-actions">
          <button class="search-trigger" id="globalSearch"><span>⌕</span><span>搜索客户、项目、员工</span><kbd>⌘ K</kbd></button>
          <button class="icon-button" id="helpButton" aria-label="帮助">?</button>
          <button class="icon-button notification-button" id="notificationButton" aria-label="通知">♢<i>4</i></button>
        </div>
      </header>
      <main id="main" tabindex="-1"></main>
    </section>
  </div>

  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-label="详情抽屉">
    <div class="drawer-head"><div><small id="drawerEyebrow">详情</small><h2 id="drawerTitle">记录详情</h2></div><button class="icon-button" data-close-drawer aria-label="关闭">×</button></div>
    <div class="drawer-body" id="drawerBody"></div>
    <div class="drawer-actions" id="drawerActions"></div>
  </aside>

  <dialog class="modal" id="modal">
    <form method="dialog" id="modalForm">
      <div class="modal-head"><div><small id="modalEyebrow">新建</small><h2 id="modalTitle">创建记录</h2></div><button class="icon-button" value="cancel" aria-label="关闭">×</button></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </form>
  </dialog>

  <div class="command-palette" id="commandPalette" role="dialog" aria-modal="true" aria-label="全局搜索" hidden>
    <div class="command-box">
      <div class="command-input"><span>⌕</span><input id="commandInput" aria-label="搜索" placeholder="搜索客户、项目、员工、知识…"><kbd>Esc</kbd></div>
      <div class="command-results" id="commandResults"></div>
    </div>
  </div>
  <div class="toast-region" id="toastRegion" aria-live="polite"></div>
  <script src="app.js"></script>
  <script src="performance.js"></script>
  <script src="organization-integration.js"></script>
  <script src="project-detail.js"></script>
  <script src="project-board.js"></script>
  <script src="delivery-templates.js"></script>
  <script src="asset-management.js"></script>
  <script src="lead-allocation.js"></script>
</body>
</html>
